name: fetch-assets
on:
  workflow_dispatch:
    inputs:
      pairs:
        description: "JSON list of [url, path]"
        required: true
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download
        env:
          PAIRS: ${{ github.event.inputs.pairs }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request
          for url, path in json.loads(os.environ["PAIRS"]):
              os.makedirs(os.path.dirname(path), exist_ok=True)
              urllib.request.urlretrieve(url, path)
              print("saved", path, os.path.getsize(path))
          PY
      - name: Commit
        run: |
          git config user.name "asset-bot"
          git config user.email "asset-bot@users.noreply.github.com"
          git add -A assets
          git commit -m "fetch assets" || exit 0
          git pull --rebase
          git push
