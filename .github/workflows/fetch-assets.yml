name: fetch-assets
on:
  workflow_dispatch:
    inputs:
      pairs:
        description: "JSON list of [url, path]"
        required: true
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download
        env:
          PAIRS: ${{ github.event.inputs.pairs }}
        run: |
          echo "$PAIRS" | python3 -c "import json,sys;[print(u+' '+p) for u,p in json.load(sys.stdin)]" > /tmp/list.txt
          while read url path; do
            mkdir -p "$(dirname "$path")"
            code=$(curl -sL -A "Mozilla/5.0" -o "$path" -w "%{http_code}" "$url")
            echo "$path http=$code size=$(stat -c%s "$path")"
          done < /tmp/list.txt
      - name: Commit
        run: |
          git config user.name "asset-bot"
          git config user.email "asset-bot@users.noreply.github.com"
          git add -A assets
          git commit -m "fetch assets" || exit 0
          git pull --rebase
          git push
