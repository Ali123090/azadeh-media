name: ig-research
on:
  workflow_dispatch:
    inputs:
      cfg:
        description: 'JSON config: usernames, hashtags, per_user, per_tag, out'
        required: true
permissions:
  contents: write
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Fetch
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          CFG: ${{ github.event.inputs.cfg }}
        run: python3 scripts/ig_research.py
      - name: Commit
        run: |
          git config user.name "research-bot"
          git config user.email "research-bot@users.noreply.github.com"
          git add -A assets/research
          git commit -m "ig research" || exit 0
          git pull --rebase
          git push
