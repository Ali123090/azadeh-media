name: ig-post
on:
  workflow_dispatch:
    inputs:
      url: {description: 'Instagram post url', required: true}
      out: {description: 'output path prefix', required: true}
permissions:
  contents: write
jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          POST_URL: ${{ github.event.inputs.url }}
          OUT: ${{ github.event.inputs.out }}
        run: python3 scripts/ig_post.py
      - name: Commit
        run: |
          git config user.name "research-bot"
          git config user.email "research-bot@users.noreply.github.com"
          git add -A assets/research
          git commit -m "ig post" || exit 0
          git pull --rebase
          git push
