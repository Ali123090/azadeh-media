name: process-video
on:
  workflow_dispatch:
    inputs:
      drive_id: {required: true}
      name: {required: true}
      pubkey: {required: true}
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Process
        env:
          DRIVE_ID: ${{ github.event.inputs.drive_id }}
          NAME: ${{ github.event.inputs.name }}
          PUBKEY: ${{ github.event.inputs.pubkey }}
        run: bash scripts/process_video.sh
      - name: Commit
        if: always()
        run: |
          git config user.name "video-bot"
          git config user.email "video-bot@users.noreply.github.com"
          git add -A assets/private
          git commit -m "process video" || exit 0
          git pull --rebase
          git push
