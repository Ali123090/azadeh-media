name: telegram-publisher
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "run or test"
        default: "run"
concurrency:
  group: telegram-publisher
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish due posts
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python3 scripts/telegram_publisher.py "${{ github.event.inputs.mode || 'run' }}"
      - name: Save state
        run: |
          if [ -n "$(git status --porcelain queue/telegram)" ]; then
            git config user.name "telegram-bot"
            git config user.email "telegram-bot@users.noreply.github.com"
            git add queue/telegram/_state.json
            git commit -m "telegram: update state"
            git pull --rebase
            git push
          fi
