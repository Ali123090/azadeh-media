<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>داروخانه دکتر آزاده رمضانی</title>
<meta name="description" content="نکته‌های دارویی روزانه، مشاوره و ارسال درب منزل">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💊</text></svg>">
<style>
@font-face{font-family:Vazirmatn;src:url(Vazirmatn-Regular.ttf) format("truetype");font-weight:400;font-display:swap}
@font-face{font-family:Vazirmatn;src:url(Vazirmatn-Bold.ttf) format("truetype");font-weight:700;font-display:swap}
@font-face{font-family:Lalezar;src:url(Lalezar-Regular.ttf) format("truetype");font-display:swap}
:root{--ox:#3B0D11;--red:#A4161A;--amb:#E9A23B;--cream:#FFF6EC;--bale:#00A884}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--ox);font-family:Vazirmatn,Tahoma,sans-serif;color:var(--cream);
 padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
.wrap{max-width:460px;margin:0 auto;padding:40px 22px 32px;position:relative}
.glow{position:absolute;top:-80px;left:50%;transform:translateX(-50%);width:420px;height:420px;border-radius:50%;
 background:radial-gradient(circle,rgba(164,22,26,.55),rgba(164,22,26,0) 70%);pointer-events:none}
.logo{position:relative;width:104px;height:104px;margin:0 auto 14px;border-radius:50%;background:var(--amb);
 display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 6px rgba(233,162,59,.25)}
.logo svg{width:70px;height:70px}
h1{position:relative;font-family:Lalezar,Vazirmatn,sans-serif;font-weight:400;font-size:32px;text-align:center;margin:0 0 6px;line-height:1.3}
.sub{position:relative;text-align:center;font-size:14.5px;opacity:.85;margin:0 0 28px}
.btn{display:flex;align-items:center;gap:14px;text-decoration:none;color:var(--ox);background:var(--amb);
 border-radius:18px;padding:16px 18px;margin-bottom:14px;font-weight:700;font-size:16.5px;position:relative;
 transition:transform .15s ease}
.btn:active{transform:scale(.98)}
.btn .ic{width:42px;height:42px;border-radius:12px;background:rgba(59,13,17,.12);display:flex;align-items:center;justify-content:center;font-size:22px;flex:none}
.btn small{display:block;font-weight:400;font-size:12.5px;opacity:.8;margin-top:2px}
.btn.primary{background:var(--cream)}
.btn.bale{background:var(--bale);color:#fff}
.btn.bale .ic{background:rgba(255,255,255,.18)}
.note{margin-top:22px;border:1px dashed rgba(255,246,236,.35);border-radius:16px;padding:14px 16px;font-size:13px;line-height:1.9;opacity:.85}
.foot{text-align:center;font-size:12px;opacity:.55;margin-top:26px;direction:ltr}
</style>
</head>
<body>
<div class="wrap">
 <div class="glow"></div>
 <div class="logo"><svg width="70" height="70" viewBox="0 0 140 140"><g transform="translate(70,70) rotate(-35)"><rect x="-56" y="-22" width="112" height="44" rx="22" fill="#fff" stroke="#3B0D11" stroke-width="5"/><path d="M0 -22 H-34 A22 22 0 0 0 -34 22 H0 Z" fill="#A4161A"/></g></svg></div>
 <h1>داروخانه دکتر آزاده رمضانی</h1>
 <p class="sub">نکته‌های دارویی روزانه · مشاوره · ارسال درب منزل</p>
